[package]
name = "settings"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[[bin]]
name = "brushkey-settings"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
ime = { path = "../ime" }
windows-core = "0.62"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
